name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - name: operator log must stay intact
        run: |
          for f in logs/*.jsonl; do [ -e "$f" ] || continue; python -m mizan log verify --file "$f"; done
